name: Run finalpool build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build finalpool
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          SPECS="$(git show origin/finalpool:.github/workflows/build-finalpool.yml | awk '/^          SPECS=\($/{flag=1;next}/^          \)$/{flag=0}flag')"
          git checkout -B finalpool origin/finalpool
          mkdir -p tasks/finalpool
          while IFS= read -r spec; do
            if [ -z "$spec" ]; then continue; fi
            read -r branch dev task <<< "$spec"
            dest="tasks/finalpool/$task"
            if [ -e "$dest" ]; then
              echo "Duplicate destination: $dest" >&2
              exit 1
            fi
            tmp="$(mktemp -d)"
            git archive "origin/$branch" "tasks/$dev/$task" | tar -x -C "$tmp"
            cp -a "$tmp/tasks/$dev/$task" "$dest"
            rm -rf "$tmp"
          done <<< "$SPECS"
          test "$(find tasks/finalpool -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 79
          test "$(find tasks/finalpool -type f | wc -l)" -eq 397
          git rm -f .github/workflows/build-finalpool.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tasks/finalpool
          git commit -m "Add implemented tasks to finalpool"
          git push origin HEAD:finalpool
